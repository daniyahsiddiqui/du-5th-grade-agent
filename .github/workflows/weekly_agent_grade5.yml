name: DU 5th Grade Weekly Agent Run

on:
  schedule:
    # Runs every Sunday at 9:00 AM Central Time (14:00 UTC)
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run agent code from'
        required: true
        default: 'main'
        type: choice
        options:
          - 'main'

permissions:
  contents: write

jobs:
  run-weekly-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (main branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'main' }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run 5th Grade Weekly Agent & Email Digest
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL_5TH || secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: 587
        run: |
          python agent.py --run-now --send-email

      - name: Deploy Live 1-Page Digest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
